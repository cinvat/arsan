# Storage is per-VM volumes, Nova-style. Inline entries provision at create;
# {volume_id} entries claim a prepared volume instead. The boot volume
# carries boot_index 0; delete_on_termination removes the file with the
# record, while shared volumes and isos are never deleted.
apiVersion: v1alpha1
kind: VirtualMachine
metadata:
  name: db1
  namespace: demo
spec:
  flavorRef: m1.medium
  volumes:
    - {name: root, size: 20GB, image: https://example.com/base.qcow2, boot_index: 0, delete_on_termination: true}
    - {name: data, size: 50GB}
    - {name: logs, size: 10GB}
---
# Rescue: a cdrom is just a volume with an iso and no size. Attach it,
# move boot to it, start — detach and delete it when done.
apiVersion: v1alpha1
kind: Volume
metadata:
  name: rescue-iso
  namespace: demo
spec:
  image: https://example.com/rescue.iso
  cdrom: true
